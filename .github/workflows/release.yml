name: release

# Tag-driven GitHub releases. New tags always carry the `v` prefix:
#
#   stable      vX.Y.Z       must be reachable from `main`  -> Release
#   pre-release vX.Y.Z-rc.N  must be reachable from `dev` AND not from `main`
#                            -> Pre-release (release-candidate lane only)
#
# Anything else (`-pre.N`, arbitrary suffixes) is refused. The base version
# `X.Y.Z` must equal the version this repository publishes in its `index`
# manifest (see `VERSION_FILE`, which is `index`, not a Cargo file): the tag is
# not allowed to disagree with the package the repository hands out. Every
# release gets a source archive (the `index` and `pkg/*.ppkg` files) and a
# `.sha256` next to it.
#
# `index` and `pkg/` describe **stable releases only**: package files built from
# a pagh-programs `dev` commit or an `-rc.N` tag must never be committed here,
# even though an `-rc.N` tag of this repository is allowed to validate the
# pre-release lane (see RELEASING.md).
#
# Old bare-numeric tags remain valid history (the workflow still accepts them on
# push); only newly created tags must use the `v` prefix.

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

env:
  VERSION_FILE: index

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag branch and version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main dev
          tag="${GITHUB_REF_NAME}"
          base="${tag#v}"
          base="${base%%-*}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::new tags must be vX.Y.Z or vX.Y.Z-rc.N (got $tag)"; exit 1 ;;
          esac
          case "$tag" in
            *-rc.[0-9]*)
              git merge-base --is-ancestor "$GITHUB_SHA" origin/dev || {
                echo "::error::pre-release $tag must be reachable from dev"; exit 1; }
              if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo "::error::pre-release $tag must not point at a commit already on main"; exit 1
              fi
              ;;
            *-*)
              echo "::error::only the -rc.N suffix is supported for pre-releases (got $tag)"; exit 1
              ;;
            *)
              git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
                echo "::error::stable release $tag must be reachable from main"; exit 1; }
              ;;
          esac
          case "$VERSION_FILE" in
            index)
              [ -f index ] || { echo "::error::no index manifest"; exit 1; }
              # First package record after the `PPKGINDEX 1` header: its second
              # tab-separated field is the published package version.
              version="$(awk 'NR > 1 && NF >= 2 { print $2; exit }' index)"
              ;;
            *)
              if [ -f "$VERSION_FILE" ]; then
                version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' "$VERSION_FILE" | head -n1)"
              elif [ -f VERSION ]; then
                version="$(tr -d '[:space:]' < VERSION)"
              else
                echo "::error::no version source at $VERSION_FILE"; exit 1
              fi
              ;;
          esac
          if [ -z "$version" ]; then
            echo "::error::no package version found in $VERSION_FILE"; exit 1
          fi
          if [ "$version" != "$base" ]; then
            echo "::error::tag base $base does not match version source $VERSION_FILE ($version)"; exit 1
          fi
          echo "tag=$tag version=$version" >> "$GITHUB_STEP_SUMMARY"

      # The repository is only as good as the index/package agreement; run the
      # same read-only gate as CI before anything is archived and published.
      - name: Verify the package repository
        run: python3 tools/verify.py

      - name: Create source archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          name="$(basename "$GITHUB_REPOSITORY")-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar.gz --prefix="${GITHUB_REF_NAME}/" -o "$name" "$GITHUB_SHA"
          sha256sum "$name" > "$name.sha256"
          echo "ARCHIVE=$name" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256